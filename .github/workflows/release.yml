name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/screen-timer \
            target/x86_64-apple-darwin/release/screen-timer \
            -output screen-timer
          chmod +x screen-timer

      - name: Package
        run: |
          tar czf screen-timer-${{ github.ref_name }}-macos-universal.tar.gz screen-timer
          shasum -a 256 screen-timer-${{ github.ref_name }}-macos-universal.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            screen-timer-${{ github.ref_name }}-macos-universal.tar.gz
            checksums.txt

      - name: Update Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 screen-timer-${{ github.ref_name }}-macos-universal.tar.gz | awk '{print $1}')
          VERSION=${{ github.ref_name }}
          DOWNLOAD_URL="https://github.com/mattisonchao/screen-timer/releases/download/${VERSION}/screen-timer-${VERSION}-macos-universal.tar.gz"

          FORMULA=$(cat <<RUBY
          class ScreenTimer < Formula
            desc "macOS menu bar timer to enforce context switching"
            homepage "https://github.com/mattisonchao/screen-timer"
            url "${DOWNLOAD_URL}"
            sha256 "${SHA}"

            def install
              bin.install "screen-timer"
            end

            def caveats
              <<~EOS
                To start screen-timer as a menu bar app:
                  screen-timer

                To control via CLI:
                  screen-timer start 25m
                  screen-timer pomodoro
                  screen-timer status
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/screen-timer --version")
            end
          end
          RUBY
          )

          # Clone the tap repo and update the formula
          git clone "https://x-access-token:${GH_TOKEN}@github.com/mattisonchao/homebrew-tap.git" /tmp/homebrew-tap || true
          if [ -d /tmp/homebrew-tap ]; then
            mkdir -p /tmp/homebrew-tap/Formula
            echo "${FORMULA}" > /tmp/homebrew-tap/Formula/screen-timer.rb
            cd /tmp/homebrew-tap
            git add Formula/screen-timer.rb
            git commit -m "Update screen-timer to ${VERSION}" || true
            git push || true
          fi
