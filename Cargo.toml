[package]
name = "screen-timer"
version = "0.3.0"
edition = "2024"
description = "macOS menu bar timer to enforce context switching"

[dependencies]
eframe = "0.31"
tray-icon = "0.19"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
core-graphics = "0.23"
