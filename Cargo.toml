[package]
name = "screen-timer"
version = "0.2.0"
edition = "2024"
description = "macOS menu bar timer that locks your screen to enforce breaks"

[dependencies]
eframe = "0.31"
tray-icon = "0.19"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
core-graphics = "0.23"
